name: Build Metrolist Metro-Connect APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Metro-Connect Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build FOSS Debug APK
        run: ./gradlew assembleFossDebug --no-daemon --console=plain --warning-mode summary -x lint -x lintFossDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Metrolist-MetroConnect-APK
          path: app/build/outputs/apk/foss/debug/*.apk
